<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="products-section">

  <h2>Checkout</h2>

  <div class="product-card" style="max-width:600px; margin:auto; padding:30px;">

    <h3>Order Summary</h3>

    <br>

    <p>Product: Premium Dog Food</p>
    <p>Total: $25</p>

    <br>

    <h3>Select Payment Method</h3>

    <br>

    <label>
      <input type="radio" name="payment">
      bKash
    </label>

    <br><br>

    <label>
      <input type="radio" name="payment">
      Nagad
    </label>

    <br><br>

    <label>
      <input type="radio" name="payment">
      Cash on Delivery
    </label>

    <br><br><br>

    <button class="btn primary-btn">
      Confirm Order
    </button>

  </div>

</section>

</body>
</html>
